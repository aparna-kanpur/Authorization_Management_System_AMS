<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Management System(AMS)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #f8f9fa;
            color: #212529;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #dee2e6;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 { font-size: 28px; color: #007bff; margin-bottom: 10px; }
        .login-header p { color: #6c757d; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-size: 14px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background: #ffffff;
            color: #212529;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0,123,255,0.2);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #0069d9;
            transform: scale(1.02);
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .credentials-info {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .credentials-info p {
            margin: 5px 0;
        }
        code {
            background: #f1f1f1;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #d63384;
        }
    </style>
</head>
<body>
    <div class="login-container">
       <div class="login-header">

    <img src="boat-logo.png"
         style="height:90px; margin-bottom:15px;">

    <h1>Authorization Management System (AMS)-BOATNR</h1>

    <p style="font-size:15px; font-weight:700; color:#212529;">
    Please Login to continue
</p>

</div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username" style="font-size:15px; font-weight:700; color:#212529;">
    Username
</label>
                <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="password" style="font-size:15px; font-weight:700; color:#212529;">
    Password
</label>
                <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="errorMessage" class="error-message"></div>
        </form>

        
    </div>

    <script>

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const user = validUsers.find(u => u.username === username && u.password === password);

            if (user) {
                localStorage.setItem('taskflow_loggedIn', 'true');
                localStorage.setItem('taskflow_user', user.name);
                localStorage.setItem('taskflow_username', user.username);
                localStorage.setItem('taskflow_role', user.role);

                window.location.href = window.location.pathname.replace(/[^\/]+$/, '') + 'dashboard.html';
            } else {
                errorElement.textContent = '❌ Invalid username or password!';
                setTimeout(() => {
                    errorElement.textContent = '';
                }, 3000);
            }
        });
    </script>
</body>
</html>
